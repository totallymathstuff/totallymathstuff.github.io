<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Auto-Load Content</title>
</head>
<body>

    <h1>Welcome to My Site</h1>
    
    <!-- This is where the external page will appear -->
    <div id="main-content">Loading content...</div>

    <script>
        // Use an event listener to trigger the load on page startup
        document.addEventListener('DOMContentLoaded', () => {
            fetch('https://s3-eu-west-1.amazonaws.com/apps.playcanvas.com/bXj5OWCb/index.html')
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.text();
                })
                .then(data => {
                    document.getElementById('main-content').innerHTML = data;
                })
                .catch(error => {
                    console.error('Error loading content:', error);
                    document.getElementById('main-content').innerHTML = "Failed to load.";
                });
        });
    </script>

</body>
</html>
