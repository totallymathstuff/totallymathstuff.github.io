<body style="background-color: #6E6666">

<div style="position: relative; height: 50px; border: 0px solid black;">

<script>
function TabName(){
let NameT = prompt("Tab Name?");
document.title = `${NameT}`;
}




document.getElementById('showMoreButton').addEventListener('click', function() {
  const container = document.getElementById('hiddenButtonsContainer');
  container.classList.toggle('visible-buttons');
});










function setFavicon() {
    const fileInput = document.getElementById('imageUploader');
    const files = fileInput.files;


    if (files && files.length > 0) {
        const reader = new FileReader();


        reader.onload = function(e) {
            const imageUrl = e.target.result;
            const faviconLink = document.getElementById('favicon');
            
            
            faviconLink.href = imageUrl; 
            
            
            faviconLink.type = files[0].type; 
        };


        // Read the file as a data URL
        reader.readAsDataURL(files[0]);
    } else {
        alert("Please select an image file to upload.");
    }
}






function openTabs() { const urls = [ "https://docs.google.com/document/d/1UJ47lUExzaqsGK9M_v2Fx3B9yqt1XBohM27g4IIyZsY/edit?usp=sharing"]; urls.forEach(url => window.open(url, "_blank")); }


</script>
